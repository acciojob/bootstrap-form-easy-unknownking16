<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	 <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body>
	<div class="container mt-4">

    <div class="border p-3">

        <h2 class="text-center mb-5">Internship Form</h2>

        <form id="internship-form" novalidate>

         
            <div class="form-row">

                <div class="form-group col-md-4">
                    <label for="first-name-input">First Name</label>
                    <input
                        type="text"
                        class="form-control"
                        id="first-name-input"
                        required
                    >
                    <div class="invalid-feedback">
                        First name required!
                    </div>
                </div>

                <div class="form-group col-md-4">
                    <label for="last-name-input">Last Name</label>
                    <input
                        type="text"
                        class="form-control"
                        id="last-name-input"
                        required
                    >
                    <div class="invalid-feedback">
                        Last name required!
                    </div>
                </div>

                <div class="form-group col-md-4">
                    <label for="email-input">Email Address</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email-input"
                        placeholder="xyz@abc.com"
                        required
                    >
                    <div class="invalid-feedback">
                        Email required!
                    </div>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group col-md-6">
                    <label for="college-input">College</label>
                    <input
                        type="text"
                        class="form-control"
                        id="college-input"
                        required
                    >
                    <div class="invalid-feedback">
                        Please provide a valid college.
                    </div>
                </div>

                <div class="form-group col-md-3">
                    <label for="graduation-year">Graduation Year</label>
                    <select
                        class="custom-select"
                        id="graduation-year"
                        required
                    >
                        <option value="">Choose...</option>
                        <option value="2020">2020</option>
                        <option value="2021">2021</option>
                        <option value="2022">2022</option>
                        <option value="2023">2023</option>
                    </select>

                    <div class="invalid-feedback">
                        Please select a valid Graduation Year.
                    </div>
                </div>

                <div class="form-group col-md-3">
                    <label for="roll-no-input">Roll No.</label>
                    <input
                        type="number"
                        class="form-control"
                        id="roll-no-input"
                        required
                    >
                    <div class="invalid-feedback">
                        Please provide a valid Roll no.
                    </div>
                </div>

            </div>

          
            <div class="form-group">

                <div class="form-check">
                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="conditions-checkbox"
                        required
                    >

                    <label
                        class="form-check-label"
                        for="conditions-checkbox"
                    >
                        Agree to terms and conditions
                    </label>

                    <div class="invalid-feedback">
                        You must agree before submitting.
                    </div>
                </div>

            </div>

          
            <button type="submit" class="btn btn-primary">
                Submit form
            </button>

        </form>

    </div>

</div>

	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
